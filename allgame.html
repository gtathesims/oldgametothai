<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Old Game to Thai</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>
<div class="bg-stars"></div>
<div class="bg-stars bg-stars-2"></div>
<div class="bg-glow"></div>
<div class="bg-scanlines"></div>
    
<header class="site-header">

    <div class="header-inner">

        <img
            src="images/logogame.png"
            alt="Old Game to Thai"
            class="main-logo"
        >

        <p class="tagline">
            แปลเกมเก่าให้เป็นภาษาไทย
        </p>

    </div>

</header>


<main>

    <section class="section">

        <div class="section-title">

            <h2>เกมแปลไทย</h2>

        </div>


        <div class="game-grid">


            <!-- OBSCURE -->

            <article class="game-card">

                <a href="games/obscure.html">

                    <div class="game-image">

                        <img
                            src="images/ob1/ob1.jpg"
                            alt="Obscure ภาษาไทย"
                        >

                        <div class="game-status">
                            พร้อมใช้งาน
                        </div>

                    </div>


                    <div class="game-info">

                        <h3>Obscure</h3>

                        <p>
                            ม็อดภาษาไทยสำหรับ Obscure
                        </p>

                        <div class="game-meta">

                            <span>PC</span>

                            <span>ภาษาไทย</span>

                        </div>

                    </div>

                </a>

            </article>


            <!-- OBSCURE2 -->

            <article class="game-card">

                <a href="games/obscure2.html">

                    <div class="game-image">

                        <img
                            src="images/ob2/ob2cover.jpg"
                            alt="Obscure2 ภาษาไทย"
                        >

                        <div class="game-status">
                            พร้อมใช้งาน
                        </div>

                    </div>


                    <div class="game-info">

                        <h3>Obscure</h3>

                        <p>
                            ม็อดภาษาไทยสำหรับ Obscure2
                        </p>

                        <div class="game-meta">

                            <span>PC</span>

                            <span>ภาษาไทย</span>

                        </div>

                    </div>

                </a>

            </article>
            

        </div>

    </section>


</main>



<footer>

    <p>
        OLD GAME TO THAI
    </p>

    <p class="copyright">
        แปลเกมเก่าให้เป็นภาษาไทย
    </p>

</footer>


</body>
</html>
